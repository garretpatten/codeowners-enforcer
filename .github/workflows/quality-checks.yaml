---
name: 'Quality Checks'

on: [pull_request]

permissions:
  contents: read

jobs:
  quality-checks:
    name: 'Linters'
    # Markdown/YAML ignores: repo-root `.markdownlint-cli2.yaml` and `.yamllint.yaml` (`ignore:`).
    # yamllint disable-line rule:line-length
    uses: garretpatten/quality-checks/.github/workflows/quality-checks.yaml@fe4c2bf7655d5315e264422532786d1dd970248e # master
    with:
      # Pin merge-base for PRs (see quality-checks README: "Comparing against the correct base commit").
      diff_base: ${{ github.event.pull_request.base.sha }}
      markdownlint_run: true
      prettier_run: true
      shellcheck_run: false
      yamllint_run: true
    # Pass only the secret the reusable workflow uses (secrets.token);
    # `secrets: inherit` violates least privilege.
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
