---
name: 'Quality Checks'

on: [pull_request]

permissions:
  contents: read

jobs:
  quality-checks:
    name: 'Linters'
    # Markdown/YAML ignores: repo-root `.markdownlint-cli2.yaml` and `.yamllint.yaml` (`ignore:`).
    # yamllint disable-line rule:line-length
    uses: garretpatten/quality-checks/.github/workflows/quality-checks.yaml@78294799f20fc78703fe62488a7d11a6903214b5  # v2
    with:
      # Pin merge-base for PRs (see quality-checks README: "Comparing against the correct base commit").
      diff_base: ${{ github.event.pull_request.base.sha }}
