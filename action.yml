name: 'Codeowners Enforcer'
description: >-
  Enforce that PR changes have a CODEOWNERS owner (.github/CODEOWNERS, CODEOWNERS, or docs/CODEOWNERS;
  gitignore rules; last match wins).
author: 'Garret Patten'
branding:
  icon: git-pull-request
  color: purple

inputs:
  changedFiles:
    description: >-
      Newline-delimited repository-relative paths of added or modified files (for example from git diff).
      Space-delimited lists are accepted as a legacy fallback, but cannot represent paths containing spaces.
    required: true

  deletedFiles:
    description: >-
      Newline-delimited repository-relative paths of deleted or moved files (for example from git diff --diff-filter=D).
      Space-delimited lists are accepted as a legacy fallback. Paths listed here are not reported as missing ownership.
    required: false

outputs:
  unownedFiles:
    description: >-
      When the check fails: newline-separated repository-relative paths with no effective owner.
      Always set; empty string when the check passes. Prefer this output for workflow comments (stable formatting).
  errorMessage:
    description: >-
      When the check fails: details listing files without an effective code owner.
      Always set; empty string when the check passes.
  skipped:
    description: >-
      Set to the string `true` when verification was skipped because the inputs exceeded the size limit.
  skipReason:
    description: Human-readable explanation when `skipped` is set.

runs:
  using: node24
  main: dist/index.js
